name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }}, pandas${{ matrix.pandas }})
    runs-on: ubuntu-latest
    # pandas 2 and pandas 3 are both tested on purpose. Under pandas 3's
    # copy-on-write, DataFrame.to_numpy can return a read-only view; pulsebench
    # scales feature matrices in place, so that difference is a real crash and
    # not a style question. It shipped once already.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        pandas: ["<3.0", ">=3.0"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The full requirements.txt pulls torch, tensorflow and sdv — hundreds of
      # megabytes that no test in this job touches. The suites that run here
      # (pulsebench, and the preprocessing pipeline on synthetic frames) need
      # only the numeric stack.
      #
      # pulsebench is installed editable rather than added to PYTHONPATH, so that
      # every run also exercises pyproject.toml: if the packaging breaks, the
      # tests go red here instead of at the first person who tries
      # `pip install git+https://...`.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install "pandas${{ matrix.pandas }}"
          pip install pyyaml joblib              # src/preprocessing
          pip install matplotlib seaborn         # src/reporting figure generation
          pip install python-docx                # src/reporting thesis build
          python -c "import pandas, numpy, sklearn; print('pandas', pandas.__version__, '| numpy', numpy.__version__, '| sklearn', sklearn.__version__)"

      - name: pulsebench unit tests + Phase 9 regression pin
        run: python -m pytest pulsebench/tests/ -q

      - name: pulsebench doctests
        run: |
          python -m doctest pulsebench/persistence.py pulsebench/cv.py \
                            pulsebench/disqualification.py pulsebench/multiplicity.py \
                            pulsebench/integrity.py

      - name: Preprocessing pipeline tests
        run: python -m pytest src/preprocessing/test_pipeline.py -q

      # Renders all 21 figures from the committed metrics JSON. This is the check
      # that the figures and the reported numbers cannot drift apart: if a phase is
      # re-run with a different schema, or a metrics file is dropped, the figures
      # stop building and CI says so.
      - name: Figure generation smoke test
        run: python -m pytest src/reporting/test_generate_figures.py -q

      # The six extension phases (fold-count sensitivity, station-held-out CV,
      # sensor-noise robustness, selective prediction, integrity auditing) assert
      # properties of their own results -- including that no model reaches a majority
      # of folds at either fold count, which is the thesis's central claim. These
      # ran only locally until now.
      - name: Extension phase tests
        run: python -m pytest src/models/test_phase_additions.py -q

      # Guards the defect that shipped once: the thesis built with 23 captions and
      # zero embedded images, because moving XML between documents left the image
      # parts behind. This counts media parts in the saved file.
      - name: Thesis assembly tests
        run: python -m pytest src/reporting/test_build_thesis.py -q

      - name: Import pulsebench from outside the repo
        working-directory: /tmp
        run: python -c "import pulsebench; print(pulsebench.__version__, pulsebench.__all__)"
