name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The full requirements.txt pulls torch, tensorflow and sdv — hundreds of
      # megabytes that no test in this job touches. The suites that run here
      # (pulsebench, and the preprocessing pipeline on synthetic frames) need
      # only the numeric stack.
      #
      # pulsebench is installed editable rather than added to PYTHONPATH, so that
      # every run also exercises pyproject.toml: if the packaging breaks, the
      # tests go red here instead of at the first person who tries
      # `pip install git+https://...`.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install pyyaml joblib      # needed by src/preprocessing only

      - name: pulsebench unit tests + Phase 9 regression pin
        run: python -m pytest pulsebench/tests/ -q

      - name: pulsebench doctests
        run: |
          python -m doctest pulsebench/persistence.py pulsebench/cv.py \
                            pulsebench/disqualification.py pulsebench/multiplicity.py

      - name: Preprocessing pipeline tests
        run: python -m pytest src/preprocessing/test_pipeline.py -q

      - name: Import pulsebench from outside the repo
        working-directory: /tmp
        run: python -c "import pulsebench; print(pulsebench.__version__, pulsebench.__all__)"
