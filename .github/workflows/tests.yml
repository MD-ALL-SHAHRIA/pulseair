name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The full requirements.txt pulls torch, tensorflow and sdv — hundreds of
      # megabytes that no test in this job touches. The suites that run here
      # (pulsebench, and the preprocessing pipeline on synthetic frames) need
      # only the numeric stack, so CI installs that directly.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.0" pandas scikit-learn scipy pyyaml joblib pytest

      - name: pulsebench unit tests + Phase 9 regression pin
        run: pytest pulsebench/tests/ -q

      - name: pulsebench doctests
        run: python -m doctest pulsebench/persistence.py pulsebench/cv.py pulsebench/disqualification.py pulsebench/multiplicity.py

      - name: Preprocessing pipeline tests
        run: pytest src/preprocessing/test_pipeline.py -q
