name: citation

on:
  push:
    paths: ["CITATION.cff", "pulsebench/CITATION.cff"]
  pull_request:
    paths: ["CITATION.cff", "pulsebench/CITATION.cff"]
  workflow_dispatch:

jobs:
  validate:
    name: Validate CITATION.cff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dieghernan/cff-validator@v4
        with:
          citation-path: CITATION.cff
      - uses: dieghernan/cff-validator@v4
        with:
          citation-path: pulsebench/CITATION.cff
